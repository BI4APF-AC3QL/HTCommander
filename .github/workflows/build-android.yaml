name: Build Android

on:
  push:
    branches: [main, 'feature/remote-aprs-dashboard']
    paths:
      - 'src/lib/**'
      - 'src/android/**'
      - 'src/pubspec.yaml'
      - 'src/pubspec.lock'
      - 'docs/android-radio-server.md'
      - '.github/workflows/build-android.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.5'

      - name: Configure Android signing
        run: |
          signing_values=(
            "$ANDROID_KEYSTORE_BASE64"
            "$ANDROID_STORE_PASSWORD"
            "$ANDROID_KEY_PASSWORD"
            "$ANDROID_KEY_ALIAS"
          )
          configured_count=0
          for value in "${signing_values[@]}"; do
            if [[ -n "$value" ]]; then
              configured_count=$((configured_count + 1))
            fi
          done

          if [[ "$configured_count" -eq 0 ]]; then
            echo "Android signing secrets are not configured; test artifacts will use the debug key."
          elif [[ "$configured_count" -ne "${#signing_values[@]}" ]]; then
            echo "::error::Android signing secrets are incomplete. Configure all four secrets or remove them all."
            exit 1
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > src/android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=app/upload-keystore.jks\n' \
              "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" \
              > src/android/key.properties
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Install dependencies
        working-directory: src
        run: flutter pub get

      - name: Build signed Android APK
        working-directory: src
        run: flutter build apk --release

      - name: Build signed Android App Bundle
        working-directory: src
        run: flutter build appbundle --release

      - name: Clean up signing secrets
        if: always()
        working-directory: src/android
        run: rm -f key.properties app/upload-keystore.jks

      - name: Upload Android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-apk
          path: src/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-aab
          path: src/build/app/outputs/bundle/release/app-release.aab
